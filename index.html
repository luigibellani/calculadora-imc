<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Calculadora de IMC</h1>
    <p>Calcule seu Índice de Massa Corporal</p>

    <label for="peso">Peso (kg):</label>
    <input type="number" id="peso" placeholder="Ex: 70">

    <label for="altura">Altura (m ou cm):</label>
    <input type="number" id="altura" placeholder="Ex: 1.75 ou 175">

    <div class="botoes">
      <button onclick="calcularIMC()">Calcular</button>
      <button onclick="limparCampos()">Limpar</button>
    </div>

    <div id="resultado" class="resultado" style="display: none;">
      <p>Seu IMC:</p>
      <h2 id="valorIMC">0.0</h2>
      <p id="classificacao">--</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
